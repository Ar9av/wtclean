[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-wtclean"
dynamic = ["version"]
description = "Clean up the git worktrees coding agents leave behind, without losing work"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["git", "worktree", "cleanup", "claude-code", "codex", "ai-agents"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/Ar9av/wtclean"

[project.scripts]
wtclean = "git_wtclean:main"
git-wtclean = "git_wtclean:main"

[tool.hatch.version]
path = "git_wtclean.py"

[tool.hatch.build.targets.sdist]
include = ["git_wtclean.py", "README.md", "LICENSE"]
